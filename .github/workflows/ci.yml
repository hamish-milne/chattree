name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Only a pull request's older run is cancelled. A push to main finishes: cancelling it shows up as a failure on Windows ("Terminate batch job").
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # The quick group (pnpm test) on both platforms: the Windows paths (busybox, cmd.exe, path handling) only run for real there.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The run and script tools use busybox on Windows; the tests that run real shell commands need it installed (it is checked against a pinned hash).
      - if: runner.os == 'Windows'
        run: node tools/fetch-busybox.ts
      # The runner's D: drive is much faster than C: for the many small files and processes the tests create.
      - if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Force D:\tmp
      - run: pnpm test
        env:
          TEMP: ${{ runner.os == 'Windows' && 'D:\tmp' || runner.temp }}
          TMP: ${{ runner.os == 'Windows' && 'D:\tmp' || runner.temp }}
          TMPDIR: ${{ runner.temp }}

  # Exhaustive crash injection, random operations and live-check runs (see test/support/slow.ts).
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:slow
